name: Release
# Push a tag vX.Y.Z (matching __version__) to build and create (or refresh) the GitHub release.
# PyPI publishing runs only when the repository variable PYPI_PUBLISH is "true"
# (set it after adding this workflow as a trusted publisher on pypi.org).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r\"__version__ = '(.+)'\", open('src/ezyplatform_cli/__init__.py').read())[1])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/
      - name: Create the release, or replace its files when it already exists
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
