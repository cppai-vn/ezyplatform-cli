name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: ezy --version
      - run: python -m unittest discover -s tests -v

  # The one-line installers, as a new user runs them (uv is installed by the script when missing).
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: sh install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy ByPass -File install.ps1
      - name: ezy runs from the uv tool bin dir
        shell: bash
        run: |
          bin=$(uv tool dir --bin 2>/dev/null || "$HOME/.local/bin/uv" tool dir --bin)
          "$bin/ezy" --version
          "$bin/ezy" new site --admin-url https://admin.example.com >/dev/null
          "$bin/ezy" doctor || true
          test -f site/environment.json
